[build]
  publish = "public"
  functions = "netlify/functions"

# Pretty API path: /api/sos  ->  the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# DataForSEO live endpoints can take 15-20s. Default is 10s, so raise it.
[functions]
  node_bundler = "esbuild"

[functions."sos"]
  # seconds; Netlify allows up to 26 on paid plans
  timeout = 26

[functions."answerz-gap"]
  # DataForSEO live SERP calls run 12-18s; the default cuts them off
  timeout = 26
